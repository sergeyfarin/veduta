name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build, contracts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go vet ./...
      # internal/contracts is the contract suite: structural schema validation over the
      # adversarial corpus, RE2 pattern portability, canonical digests over golden fixtures,
      # the cross-document semantic checks with their negative fixtures, and the SPDX and
      # dependency-licence guards.
      - run: go test -race ./...
      - run: test -z "$(gofmt -l cmd internal web)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter veduta-web check
      - run: pnpm --filter veduta-web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          retention-days: 1

  release-build:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: '7' } # Raspberry Pi is a primary target
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # The binary embeds the SPA, so the real frontend build is what gets cross-compiled -
      # not the placeholder that keeps `go build` working on a clean clone.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X veduta.dev/veduta/internal/version.Version=0.0.0-ci -X veduta.dev/veduta/internal/version.Commit=${GITHUB_SHA::12}" \
            -o "veduta-${GOOS}-${GOARCH}${GOARM:+v$GOARM}" ./cmd/veduta
      - name: Report size
        run: ls -lh veduta-* | awk '{print $9, $5}'

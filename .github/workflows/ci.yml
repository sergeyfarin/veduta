name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install jsonschema pyyaml
      # Four layers: structural schemas, Go RE2 pattern portability, cross-language canonical
      # digest, and the semantic checks with their negative fixtures.
      - run: python3 scripts/validate-schemas.py

  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l cmd internal)"

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build, contracts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go vet ./...
      # internal/contracts is the contract suite: structural schema validation over the
      # adversarial corpus, RE2 pattern portability, canonical digests over golden fixtures,
      # the cross-document semantic checks with their negative fixtures, and the SPDX and
      # dependency-licence guards.
      - run: go test -race ./...
      - run: test -z "$(gofmt -l cmd internal web)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # v2.13.2 is the first release that understands Go 1.27: older ones fail either on the
      # language-version check (prebuilt binaries are compiled with an older Go) or, built from
      # source, on the standard library's export data ("export data version 4 is greater than
      # maximum supported version 2"). install-mode: goinstall builds it with the toolchain above.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-mode: goinstall

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No version here on purpose: package.json's packageManager field is the single source
      # of truth, and specifying both makes the action fail with a version-mismatch error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # web/src/lib/types/{widget,cardstate}.ts are generated from schemas/*.schema.json
      # (milestone B2) - regenerating here and diffing catches drift between the checked-in
      # files and their source of truth as a build failure, not something noticed later.
      - run: pnpm gen-types
      - run: git diff --exit-code -- web/src/lib/types
      - run: pnpm --filter veduta-web check
      - run: pnpm --filter veduta-web test
      - run: pnpm --filter veduta-web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          retention-days: 1

  visual:
    name: Visual regression (--fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Pinned by web/package.json's @playwright/test version - see docs/00-review-and-prior-art.md
      # C14: one browser, one OS/font environment, in CI and locally alike.
      - run: pnpm --filter veduta-web exec playwright install --with-deps chromium
      - run: pnpm --filter veduta-web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/test-results
          retention-days: 7

  release-build:
    name: Cross-compile ${{ matrix.label }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-amd64, goos: linux, goarch: amd64 }
          - { label: linux-arm64, goos: linux, goarch: arm64 }
          - { label: linux-armv7, goos: linux, goarch: arm, goarm: '7' } # Raspberry Pi is a primary target
          - { label: darwin-arm64, goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # The binary embeds the SPA, so the real frontend build is what gets cross-compiled -
      # not the placeholder that keeps `go build` working on a clean clone.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X veduta.dev/veduta/internal/version.Version=0.0.0-ci -X veduta.dev/veduta/internal/version.Commit=${GITHUB_SHA::12}" \
            -o "veduta-${{ matrix.label }}" ./cmd/veduta
      - name: Report size
        run: ls -lh veduta-* | awk '{print $9, $5}'

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build, contracts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go vet ./...
      # docs/configuration.md is generated from the versioned schema; keep the readable
      # reference and the contract accepted by the loader in the same change.
      - run: go run ./hack/gen-config-reference.go -check
      # internal/contracts is the contract suite: structural schema validation over the
      # adversarial corpus, RE2 pattern portability, canonical digests over golden fixtures,
      # the cross-document semantic checks with their negative fixtures, and the SPDX and
      # dependency-licence guards.
      - run: go test -race ./...
      - name: Fuzz untrusted document, manifest and token inputs
        run: |
          go test -run=^$ -fuzz=FuzzValidate -fuzztime=3s ./internal/widgets
          go test -run=^$ -fuzz=FuzzManifestParser -fuzztime=3s ./internal/integrations/manifestload
          go test -run=^$ -fuzz=FuzzTokenVerifier -fuzztime=3s ./internal/capabilities/assets
      - name: Scan HTTP responses for configured secrets
        run: go test ./internal/api -run=^TestConfiguredSecretsAppearInNoHTTPResponse$ -count=1
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: test -z "$(gofmt -l cmd hack internal web)"

  arm-budgets:
    name: Pi-class budgets (native ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # Four execution threads, real SQLite persistence, 50 cards and eight logical connection
      # revisions exercise the Raspberry Pi 4 class release workload on native ARM64.
      - name: 50-card load gate
        run: go test ./internal/scheduler -run=^TestFiftyCardPiClassLoadBudget$ -count=1 -v
      # S1a's hardware acceptance for the WASM runtime: cold compilation of the real Jellyfin
      # module, warm invocation and resident memory per instance, judged against S1b's kill
      # criteria. Cross-compilation cannot establish these, which is why they waited for a native
      # runner rather than a build matrix. -v is load-bearing: the numbers in this job's log are
      # the evidence, not merely the pass. The module is committed, so no Rust toolchain is needed.
      - name: WASM runtime budgets
        run: go test ./internal/integrations/wasm -run=^TestPluginRuntimePiClassBudget$ -count=1 -v

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # v2.13.2 is the first release that understands Go 1.27: older ones fail either on the
      # language-version check (prebuilt binaries are compiled with an older Go) or, built from
      # source, on the standard library's export data ("export data version 4 is greater than
      # maximum supported version 2"). install-mode: goinstall builds it with the toolchain above.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-mode: goinstall

  plugin-sdk:
    name: Rust plugin SDK and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # rust-toolchain.toml pins the compiler and installs the WASM target.
      - run: rustup show
      - run: cargo fmt --manifest-path sdk/rust/Cargo.toml --check
      - run: cargo fmt --manifest-path plugins/examples/hello/Cargo.toml --check
      - run: cargo fmt --manifest-path plugins/jellyfin/Cargo.toml --check
      - run: cargo test --manifest-path sdk/rust/Cargo.toml
      - run: make -C plugins verify
      # This job is the one place with both cargo and Go, so the attribution document is checked
      # here. `make verify` above has already populated the registry, so --offline resolves.
      # Bundling a new crate or npm package fails the build until the notices are regenerated.
      - run: go run ./hack/gen-third-party-notices.go -check
      - run: go run ./cmd/veduta plugin validate plugins/examples/hello/hello.wasm
      - run: go run ./cmd/veduta plugin validate plugins/jellyfin/jellyfin.wasm
      - run: go run ./cmd/veduta plugin validate plugins/examples/hello/target/wasm32-unknown-unknown/release/veduta_hello.wasm
      - run: go run ./cmd/veduta plugin validate plugins/jellyfin/target/wasm32-unknown-unknown/release/veduta_jellyfin.wasm

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No version here on purpose: package.json's packageManager field is the single source
      # of truth, and specifying both makes the action fail with a version-mismatch error.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # web/src/lib/types/{widget,cardstate}.ts are generated from schemas/*.schema.json
      # (milestone B2) - regenerating here and diffing catches drift between the checked-in
      # files and their source of truth as a build failure, not something noticed later.
      - run: pnpm gen-types
      - run: git diff --exit-code -- web/src/lib/types
      - run: pnpm --filter veduta-web check
      - run: pnpm --filter veduta-web test
      - run: pnpm --filter veduta-web build
      # The build records which npm packages Rollup actually put in the bundle. Diffing it makes
      # newly bundled third-party code a build failure until THIRD-PARTY-NOTICES.md is regenerated.
      - run: git diff --exit-code -- web/bundled-packages.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build
          retention-days: 1

  visual:
    name: Visual regression (--fixtures)
    runs-on: ubuntu-latest
    # The official image, pinned to the exact tag matching web/package.json's @playwright/test
    # version - see docs/00-review-and-prior-art.md C14 ("one OS/font environment"). This is not
    # a nicety: a bare ubuntu-latest runner plus `playwright install --with-deps chromium` still
    # showed a real ~1% pixel difference against baselines generated on a different Ubuntu box,
    # from font rendering alone, with the identical browser build. The baselines under
    # web/tests/visual.spec.ts-snapshots/ were generated and re-verified inside this exact image
    # (`docker run mcr.microsoft.com/playwright:v1.63.0-noble`) precisely so CI reproduces that,
    # not some other machine's fonts. TestPlaywrightImageMatchesPackage keeps the tag and the
    # package version together; they drifted once and CI was the only thing that noticed.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # Node and pnpm (via corepack) ship in the image already, at the versions the baselines
      # were generated with; installing another copy would defeat the point of pinning the image.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter veduta-web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/test-results
          retention-days: 7

  release-build:
    name: Cross-compile ${{ matrix.label }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-amd64, goos: linux, goarch: amd64 }
          - { label: linux-arm64, goos: linux, goarch: arm64 }
          - { label: linux-armv7, goos: linux, goarch: arm, goarm: '7' } # Raspberry Pi is a primary target
          - { label: darwin-arm64, goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      # The binary embeds the SPA, so the real frontend build is what gets cross-compiled -
      # not the placeholder that keeps `go build` working on a clean clone.
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web/build
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X veduta.dev/veduta/internal/version.Version=0.0.0-ci -X veduta.dev/veduta/internal/version.Commit=${GITHUB_SHA::12}" \
            -o "veduta-${{ matrix.label }}" ./cmd/veduta
      - name: Report size
        run: ls -lh veduta-* | awk '{print $9, $5}'

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build, contracts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go vet ./...
      # internal/contracts is the contract suite: structural schema validation over the
      # adversarial corpus, RE2 pattern portability, canonical digests over golden fixtures,
      # and the cross-document semantic checks with their negative fixtures.
      - run: go test ./...
      - run: test -z "$(gofmt -l cmd internal)"

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter veduta-web check
      - run: pnpm --filter veduta-web build

# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# Publishing is deliberately tag-triggered rather than automatic on main: cutting a release is a
# decision, not a side effect of merging. workflow_dispatch with dry_run builds and verifies
# everything while publishing nothing, so the pipeline can be exercised without spending a version
# number on it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing anything'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # A dispatch run is a dry run unless explicitly told otherwise; a tag push never is.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  gate:
    name: Required checks for this exact commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Publishing and testing were independent: CI triggers on pushes to main and on pull
      # requests, and a tag push triggers neither, so a tag could be cut on any commit - including
      # one whose CI run failed or never happened - and this workflow would build, sign, push to
      # GHCR and create the release without a single test having run for it. The artefact
      # verification further down proves the binary runs and carries its notices; it does not
      # prove the code in it passed anything.
      #
      # This gate asks the one question that matters at release time: did the required suite
      # succeed for THIS commit, not for something near it. A tag pointing at a main commit
      # normally has that run already; a tag on an unmerged or amended commit does not, and that
      # is precisely the case worth stopping. A run still in progress is not a pass either - the
      # message says to wait rather than pretending the tag is bad.
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          successes="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$successes" -gt 0 ]; then
            echo "CI succeeded for ${GITHUB_SHA}"
            exit 0
          fi
          echo "No successful CI run for ${GITHUB_SHA}."
          echo "Push the commit to main, let CI finish, and tag that exact commit."
          # A dry run exists to exercise this pipeline, including this gate, on commits that may
          # never have been on main. It reports and continues; only a real publication is blocked.
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::warning::Dry run continuing without a successful CI run for this commit."
            exit 0
          fi
          exit 1

  binaries:
    name: Binaries and checksums
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # version strings come from tags
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - run: pnpm install --frozen-lockfile
      # Built once and reused by every target: the SPA is architecture-independent, and rebuilding
      # it per platform would risk four subtly different bundles in one release.
      - run: pnpm --filter veduta-web build

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="0.0.0-dispatch-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # Each archive carries the licences and the generated attribution alongside the binary:
      # the notices are embedded and served by the binary too, but a licence obligation is not
      # satisfied by requiring the recipient to run the program to read it.
      #
      # It also carries the first-party integrations, staged by hack/stage-plugins.sh. They are
      # files beside the binary rather than bytes inside it, so that a shipped integration is
      # approved in veduta.lock.yaml on the same terms as a third-party one - and so that a
      # download is usable without cloning the repository.
      - name: Cross-compile and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          commit="$(git rev-parse --short HEAD)"
          ldflags="-s -w -X veduta.dev/veduta/internal/version.Version=${VERSION} -X veduta.dev/veduta/internal/version.Commit=${commit}"
          for target in linux/amd64 linux/arm64 linux/arm/v7 darwin/arm64; do
            goos="${target%%/*}"
            rest="${target#*/}"
            goarch="${rest%%/*}"
            goarm=""
            label="${goos}-${goarch}"
            if [ "$rest" != "$goarch" ]; then
              goarm="${rest#*/v}"
              label="${goos}-${goarch}v${goarm}"
            fi
            echo "building $label"
            staging="dist/veduta-${VERSION}-${label}"
            mkdir -p "$staging"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -trimpath -ldflags "$ldflags" -o "$staging/veduta" ./cmd/veduta
            cp LICENSE LICENSING.md LICENSE-PLUGIN-EXCEPTION.txt THIRD-PARTY-NOTICES.md README.md "$staging/"
            hack/stage-plugins.sh "$staging/plugins"
            tar -czf "${staging}.tar.gz" -C dist "$(basename "$staging")"
            rm -rf "$staging"
          done
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS

      # Proves the artefact runs and reports the version it claims, before anyone downloads it.
      - name: Verify the linux-amd64 artefact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "dist/veduta-${VERSION}-linux-amd64.tar.gz" -C /tmp
          root="/tmp/veduta-${VERSION}-linux-amd64"
          got="$("$root/veduta" version --json | grep -o '"version": "[^"]*"' | cut -d'"' -f4)"
          [ "$got" = "$VERSION" ] || { echo "binary reports $got, expected $VERSION"; exit 1; }
          test -s "$root/THIRD-PARTY-NOTICES.md"
          # Exactly the distributed set: no Rust sources, no Cargo locks, no hello example, and
          # nothing silently dropped either. diff fails on a difference in either direction.
          diff <(hack/stage-plugins.sh --list | sort) \
               <(cd "$root/plugins" && find . -type f | sed 's|^\./||' | sort)
          # Every shipped manifest must load and digest - an archive whose manifest cannot be read
          # is one nobody can approve.
          for manifest in "$root"/plugins/*/manifest.yaml; do
            "$root/veduta" manifest digest "$manifest"
          done
          # And every shipped module must pass the same validation the loader applies.
          for module in "$root"/plugins/*/*.wasm; do
            [ -e "$module" ] || continue
            "$root/veduta" plugin validate "$module"
          done
          echo "artefact reports $got and carries its notices"

      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dist/
          retention-days: 7

  image:
    name: Multi-arch image
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest names the newest STABLE release, and nothing else may move it - not a dispatch
          # run, not a prerelease tag, and not a pre-1.0 tag. The last of those is the point worth
          # stating: semver says 0.x carries no stability promise at all, so a 0.x build has not
          # earned the tag people get by typing `docker pull ghcr.io/…/veduta` with no tag at all,
          # which is the single most discoverable artefact this workflow produces. Until v1.0.0,
          # :latest simply does not exist, and every install has to name the version it wanted.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=dispatch-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event_name == 'push' && github.ref_name || format('0.0.0-dispatch-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: [binaries, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: release-binaries
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Marked a pre-release on GitHub for the same two reasons :latest is withheld above, so
          # the two can never disagree: an explicit prerelease identifier (v1.2.3-rc.1), or any
          # pre-1.0 tag. The second is how a 0.x release says "alpha" without spending the version
          # number on the word - the number stays clean, and GitHub still declines to show it as
          # the project's current release.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*)  prerelease="--prerelease" ;;
            v0.*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`

          Verify a download against \`SHA256SUMS\`:

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS
          \`\`\`

          **The plugin ABI is experimental and will change between releases.** Third-party WASM
          plugins must be rebuilt and re-approved on upgrade." \
            $prerelease

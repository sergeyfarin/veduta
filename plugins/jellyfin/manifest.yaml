# The WASM proof case: multi-step auth and cross-endpoint logic that a declarative
# pipeline cannot express. The module is built from sdk/ - see docs/02 milestone G4.
#
# Endpoints verified against the Jellyfin OpenAPI specification (12.0.0) during spike
# S2 - see docs/spikes/s2-upstream-reality-check.md. Jellyfin 12 removed
# /Users/{userId}/Items entirely; it is /Items with a userId query parameter, and
# recently-added is /Items/Latest.
apiVersion: veduta.dev/v1
kind: Integration
metadata:
  id: jellyfin
  name: Jellyfin
  version: 1.0.0
  description: Recently added movies and shows, with posters.
  license: Apache-2.0
  icon: sh:jellyfin
spec:
  runtime: wasm
  module: jellyfin.wasm
  sha256: "943038ecc026329cad35e5d76672257b11bb3cacb71bd5f8def189e2367b401d"
  slots:
    - name: server
      kind: http
      description: Your Jellyfin server
  capabilities: [http, assets]
  limits: { memoryMB: 64, timeoutMs: 3000, outputKB: 64, httpRequests: 5, hostCalls: 10 }
  operations:
    - id: recently-added
      name: Recently added
      defaultRefresh: 5m
      routes:
        - { slot: server, method: GET, path: /Users/Me,     reason: Resolve the authenticated user }
        - { slot: server, method: GET, path: /Items/Latest, queryKeys: [enableImageTypes, fields, imageTypeLimit, limit, userId], reason: Recently added items }
        - { slot: server, method: GET, path: /Items, queryKeys: [includeItemTypes, limit, recursive, userId], reason: Library counts by type }
        - { slot: server, method: GET, path: /Sessions,     reason: Active streams }
        # Jellyfin serves item images without authentication, so this route exists for
        # caching and to keep the server's address out of the browser - not to inject a
        # credential. See the spike notes.
        - { slot: server, method: GET, path: /Items/*/Images/Primary, use: asset, reason: Posters }
      signals:
        - { name: movies,         type: number, unit: count, history: true }
        - { name: shows,          type: number, unit: count, history: true }
        - { name: active_streams, type: number, unit: count, history: true }
      params:
        type: object
        properties:
          limit: { type: integer, minimum: 1, maximum: 24, default: 5 }

# The WASM proof case: cross-endpoint aggregation a declarative pipeline cannot
# express - one sorted list plus two typed counts plus the session list, folded
# into a single document with per-item poster handling. Built from sdk/ - see
# docs/02 milestone G4.
#
# Verified live against Jellyfin 12.0.0 on 2026-09-09 (the server's own OpenAPI,
# info.version 12.0.0). A Jellyfin API key has no associated user, so there is no
# /Users/Me step and /Items/Latest (user-scoped) is unavailable; recently-added is
# GET /Items with recursive + sortBy=DateCreated. Item images need no credential -
# the asset route is for caching and to keep the server's address out of the
# browser. See docs/spikes/s2-upstream-reality-check.md.
apiVersion: veduta.dev/v1
kind: Integration
metadata:
  id: jellyfin
  name: Jellyfin
  version: 1.0.0
  description: Recently added movies and shows, with posters.
  license: Apache-2.0
  icon: sh:jellyfin
spec:
  runtime: wasm
  module: jellyfin.wasm
  sha256: "0bd308fdbef7fa163d3217ca3396e9a43c1b2a89a18a8faa8fbe1384e1d80101"
  slots:
    - name: server
      kind: http
      description: Your Jellyfin server
  capabilities: [http, assets]
  limits: { memoryMB: 64, timeoutMs: 3000, outputKB: 64, httpRequests: 4, hostCalls: 10 }
  operations:
    - id: recently-added
      name: Recently added
      defaultRefresh: 5m
      routes:
        - { slot: server, method: GET, path: /Items, queryKeys: [recursive, includeItemTypes, sortBy, sortOrder, limit, fields, imageTypeLimit, enableImageTypes, enableImages], reason: "Recently added movies and shows, and per-type library counts" }
        - { slot: server, method: GET, path: /Sessions, reason: Active streams }
        # Jellyfin serves item images without authentication, so this route exists for
        # caching and to keep the server's address out of the browser - not to inject a
        # credential. See the spike notes.
        - { slot: server, method: GET, path: /Items/*/Images/Primary, use: asset, reason: Posters }
      signals:
        - { name: movies,         type: number, unit: count, history: true }
        - { name: shows,          type: number, unit: count, history: true }
        - { name: active_streams, type: number, unit: count, history: true }
      params:
        type: object
        properties:
          limit: { type: integer, minimum: 1, maximum: 24, default: 5 }

apiVersion: veduta.dev/v1
kind: Integration
metadata:
  id: hello-wasm
  name: Hello WASM
  version: 0.1.0
  description: Minimal Rust plugin template.
  license: Apache-2.0
  icon: sh:code
spec:
  runtime: wasm
  module: hello.wasm
  sha256: "9226bc6a3d1d51faa80f634a59c72e5b5130e8da7b1eb9bd6f964e2fa52f50e6"
  slots: []
  capabilities: []
  limits: { memoryMB: 32, timeoutMs: 1000, outputKB: 16 }
  operations:
    - id: hello
      name: Hello
      defaultRefresh: 5m
      routes: []
      signals:
        - { name: ready, type: boolean, unit: boolean, history: false }
      params: { type: object, additionalProperties: false }

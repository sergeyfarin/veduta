apiVersion: veduta.dev/v1
kind: Integration
metadata:
  id: hello-wasm
  name: Hello WASM
  version: 0.1.0
  description: Minimal Rust plugin template.
  license: Apache-2.0
  icon: sh:code
spec:
  runtime: wasm
  module: hello.wasm
  sha256: "3b5e819a870328478f9dd9b07a6495e8d8aeec8000d93aa199936b007cc4b0c1"
  slots: []
  capabilities: []
  limits: { memoryMB: 32, timeoutMs: 1000, outputKB: 16 }
  operations:
    - id: hello
      name: Hello
      defaultRefresh: 5m
      routes: []
      signals:
        - { name: ready, type: boolean, unit: boolean, history: false }
      params: { type: object, additionalProperties: false }

apiVersion: veduta.dev/v1
kind: Integration
metadata:
  id: hello-wasm
  name: Hello WASM
  version: 0.1.0
  description: Minimal Rust plugin template.
  license: Apache-2.0
  icon: sh:code
spec:
  runtime: wasm
  module: hello.wasm
  sha256: "a73b48a7910282937eb7c6647c24259028253058d833aeadc7547cd7768dec0a"
  slots: []
  capabilities: []
  limits: { memoryMB: 32, timeoutMs: 1000, outputKB: 16 }
  operations:
    - id: hello
      name: Hello
      defaultRefresh: 5m
      routes: []
      signals:
        - { name: ready, type: boolean, unit: boolean, history: false }
      params: { type: object, additionalProperties: false }

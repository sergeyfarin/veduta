# Host metrics without SSH and without credentials on the host: Glances exposes them over HTTP.
apiVersion: veduta.dev/v1
kind: Integration
metadata:
  id: glances
  name: Glances
  version: 0.2.1
  description: CPU, memory, filesystem and uptime for a Linux host running Glances.
  license: Apache-2.0
  icon: sh:glances
spec:
  runtime: declarative
  slots:
    - name: server
      kind: http
      description: A host running `glances -w`
  capabilities: [http]
  limits: { httpRequests: 6, timeoutMs: 4000, inputMB: 2, iterations: 2000 }
  operations:
    - id: overview
      name: Host overview
      defaultRefresh: 30s
      routes:
        - { slot: server, method: GET, path: /api/4/cpu,    reason: CPU utilisation }
        - { slot: server, method: GET, path: /api/4/mem,    reason: Memory utilisation }
        - { slot: server, method: GET, path: /api/4/fs,     reason: Filesystem usage }
        - { slot: server, method: GET, path: /api/4/uptime, reason: Uptime }
        - { slot: server, method: GET, path: /api/4/network, reason: Per-interface network throughput }
        - { slot: server, method: GET, path: /api/4/sensors, reason: Temperature sensors }
      signals:
        - { name: cpu.percent,     type: number, unit: percent, history: true }
        - { name: mem.percent,     type: number, unit: percent, history: true }
        - { name: fs.root.percent, type: number, unit: percent, history: true }
      pipeline:
        - as: cpu
          request: { slot: server, method: GET, path: /api/4/cpu }
        - as: mem
          request: { slot: server, method: GET, path: /api/4/mem }
        - as: fs
          request: { slot: server, method: GET, path: /api/4/fs }
        - as: uptime
          request: { slot: server, method: GET, path: /api/4/uptime }
        - as: network
          request: { slot: server, method: GET, path: /api/4/network }
        - as: sensors
          request: { slot: server, method: GET, path: /api/4/sensors }
      output:
        title: Host
        status:
          level: ok
        signals:
          cpu.percent:     { value: { expr: cpu.total } }
          mem.percent:     { value: { expr: mem.percent } }
          fs.root.percent: { value: { expr: 'first(filter(fs, .mnt_point == "/")).percent' } }
        blocks:
          # A percent-formatted value is a 0-1 fraction, like progress; the signals above stay
          # 0-100, the unit rules are written in.
          - type: progress
            items:
              - { label: CPU,    progress: { expr: cpu.total / 100 }, value: { expr: cpu.total / 100 }, format: percent }
              - { label: Memory, progress: { expr: mem.percent / 100 }, value: { expr: mem.percent / 100 }, format: percent }
              - { label: Root,   progress: { expr: 'first(filter(fs, .mnt_point == "/")).percent / 100' }, value: { expr: 'first(filter(fs, .mnt_point == "/")).percent / 100' }, format: percent }
          # Drawn from what the core has retained for this card, not from the response above: the
          # integration names its own signals and never reads stored history. Glances reports these
          # as 0-100, hence number with a unit rather than percent, which expects a 0-1 fraction.
          - type: series
            title: Last 24 hours
            format: number
            unit: "%"
            min: 0
            max: 100
            history:
              window: 24h
              lines:
                - { signal: cpu.percent, label: CPU }
                - { signal: mem.percent, label: Memory }
          - type: metrics
            items:
              - { label: Uptime, value: { expr: uptime }, format: text }
          - type: list
            title: Network
            empty: No network interfaces
            items:
              each: { expr: "take(network, 4)" }
              as: interface
              item:
                title: { expr: interface.interface_name }
                value: { expr: interface.bytes_all_rate_per_sec }
                format: bytes-rate
          - type: list
            title: Temperatures
            empty: No temperature sensors
            items:
              each: { expr: 'take(filter(sensors, .type == "temperature_core"), 4)' }
              as: sensor
              item:
                title: { expr: sensor.label }
                value: { expr: sensor.value }
                format: temperature

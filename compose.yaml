#
# A working Veduta deployment. Nothing here runs as root. Before the first `up`:
#
#   mkdir -p config data
#   printf 'VEDUTA_UID=%s\nVEDUTA_GID=%s\n' "$(id -u)" "$(id -g)" > .env
#   docker compose up -d
#   docker compose logs veduta-init      # the generated administrator password
#
# The .env file is what lets the container run as you, so the bind mounts below need no chown
# and the files stay yours to edit. docs/docker.md explains the alternatives, including what to
# do on a host where you cannot choose the uid.
#
#   docker compose --profile docker up -d     Veduta plus the read-only Docker socket proxy

name: veduta

services:
  # One-shot: writes a configuration if there is not one, then exits. It runs on every `up` and
  # does nothing once config/veduta.yaml exists, so it never overwrites your edits.
  veduta-init:
    image: ghcr.io/sergeyfarin/veduta:0.1.0
    user: "${VEDUTA_UID:-1000}:${VEDUTA_GID:-1000}"
    command: ["init"]
    volumes:
      - ./config:/config
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # To choose the password instead of having one generated, set it here and read
    # docs/docker.md on why a secret file is better than an environment variable. It is hashed
    # on the first run and the plaintext is never written to disk.
    # environment:
    #   VEDUTA_ADMIN_PASSWORD: ...

  veduta:
    image: ghcr.io/sergeyfarin/veduta:0.1.0
    # To run an unreleased build from a source checkout, replace `image:` with `build: .`
    user: "${VEDUTA_UID:-1000}:${VEDUTA_GID:-1000}"
    restart: unless-stopped
    depends_on:
      veduta-init:
        condition: service_completed_successfully
    ports:
      # Loopback only, because Veduta speaks plain HTTP. See docs/docker.md#exposure.
      - "127.0.0.1:8099:8099"
    volumes:
      - ./config:/config
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  docker-socket-proxy:
    # A GET-only subset of the Docker Engine API, for the Docker card. Mounting the raw socket
    # into Veduta instead would be equivalent to giving it root on this host.
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    profiles: [docker]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0          # no container may be started, stopped or created through this proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Deliberately not published to the host: only the compose network needs to reach it.
    expose:
      - "2375"

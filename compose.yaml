#
# A working Veduta deployment. `docker compose up -d` is the whole installation: veduta-init
# writes ./config/veduta.yaml on the first run with an administrator password it generates, and
# prints that password once.
#
#   docker compose up -d                      Veduta alone
#   docker compose logs veduta-init           the generated password, after the first run
#   docker compose --profile docker up -d     Veduta plus the read-only Docker socket proxy
#
# docs/docker.md explains every choice made here.

name: veduta

services:
  # One-shot: writes a configuration if there is not one, then exits. It runs on every `up`, and
  # does nothing at all once ./config/veduta.yaml exists, so it never overwrites your edits.
  veduta-init:
    image: ghcr.io/sergeyfarin/veduta:0.1.0
    # Root, and only here. A bind-mounted ./config belongs to you on the host, and uid 65532
    # cannot write into it; --fix-permissions grants that uid the *group* rather than taking the
    # directory, so the container can write veduta.lock.yaml and you keep editing veduta.yaml
    # without sudo. The server itself never runs as root - see the `veduta` service below.
    user: "0:0"
    command: ["init", "--fix-permissions"]
    volumes:
      - ./config:/config
    restart: "no"
    # To choose the password instead of having one generated, set it here and read
    # docs/docker.md on why a secret file is better than an environment variable. It is hashed
    # on the first run and the plaintext is never written to disk.
    # environment:
    #   VEDUTA_ADMIN_PASSWORD: ...

  veduta:
    image: ghcr.io/sergeyfarin/veduta:0.1.0
    # To run an unreleased build from a source checkout, replace `image:` with `build: .`
    restart: unless-stopped
    depends_on:
      veduta-init:
        condition: service_completed_successfully
    ports:
      # Loopback only, because Veduta speaks plain HTTP. See docs/docker.md#exposure.
      - "127.0.0.1:8099:8099"
    volumes:
      - ./config:/config
      - veduta-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  docker-socket-proxy:
    # A GET-only subset of the Docker Engine API, for the Docker card. Mounting the raw socket
    # into Veduta instead would be equivalent to giving it root on this host.
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    profiles: [docker]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0          # no container may be started, stopped or created through this proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Deliberately not published to the host: only the compose network needs to reach it.
    expose:
      - "2375"

volumes:
  veduta-data:

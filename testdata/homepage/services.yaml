        widget: {type: uptimekuma, url: http://uptime-kuma:3001}
- Applications:
    - Nextcloud:
        widget: {type: nextcloud, url: https://cloud.example.test, key: nextcloud-secret}
    - Authentik:
        widget: {type: authentik, url: https://auth.example.test, key: authentik-secret}
    - Change Detection:
        widget: {type: changedetectionio, url: http://changedetection:5000, key: change-secret}
    - Weather:
        widgets:
          - {type: openweathermap, key: weather-secret}
          - {type: future-weather, url: https://weather.example.test}
    - Docker service:
        server: local
        container: example
        ping: http://example:8080


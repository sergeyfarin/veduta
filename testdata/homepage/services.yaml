        icon: jellyfin.png
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: jellyfin-secret
    - Downloads:
        - Sonarr:
            href: https://sonarr.example.test
            widget: {type: sonarr, url: http://sonarr:8989, key: sonarr-secret}
        - Radarr:
            href: https://radarr.example.test
            widget: {type: radarr, url: http://radarr:7878, key: radarr-secret}
        - Prowlarr:
            widget: {type: prowlarr, url: http://prowlarr:9696, key: prowlarr-secret}
        - qBittorrent:
            widget: {type: qbittorrent, url: http://qbittorrent:8080}
    - Immich:
        href: https://photos.example.test
        widget: {type: immich, url: http://immich:2283, key: immich-secret}
    - Plex:
        widget: {type: plex, url: http://plex:32400, key: plex-secret}
- Infrastructure:
    - Glances:
        widget: {type: glances, url: http://glances:61208}
    - Proxmox:
        widget: {type: proxmox, url: https://proxmox:8006, key: proxmox-secret}
    - Portainer:
        widget: {type: portainer, url: https://portainer:9443, key: portainer-secret}
    - Pi-hole:
        widget: {type: pihole, url: http://pihole, key: pihole-secret}
    - Traefik:
        widget: {type: traefik, url: http://traefik:8080}
    - Home Assistant:
        widget: {type: homeassistant, url: http://homeassistant:8123, key: ha-secret}
    - NPM:
        widget: {type: nginxproxymanager, url: http://npm:81, key: npm-secret}

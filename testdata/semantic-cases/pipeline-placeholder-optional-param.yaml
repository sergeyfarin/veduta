manifests:
  glances:
    spec:
      operations:
        - id: overview
          routes:
            - { slot: server, method: GET, path: /api/4/* }
          params:
            type: object
            properties: { plugin: { type: string } }
          pipeline:
            - as: plugin
              request: { slot: server, method: GET, path: "/api/4/{plugin}" }
          output: {}
          signals: []

# Pinned toolchain. `mise install` sets everything up.
#
# Day-to-day commands run through pnpm from the repository root, because the dev loop spans both
# halves: `pnpm dev` runs the Go API and Vite together. The mise tasks below are the same things
# for anyone who prefers them, plus what CI runs.
[tools]
go = "1.27"
node = "24"
pnpm = "12"
golangci-lint = "2.13.2"  # first release that understands Go 1.27 export data

[env]
CGO_ENABLED = "0"

[tasks.install]
description = "Install Go modules and workspace packages"
run = ["go mod download", "pnpm install"]

[tasks.dev]
description = "Run the Go API and the Vite dev server together"
run = "pnpm dev"

[tasks.contracts]
description = "The contract suite: schemas, RE2 pattern portability, canonical digests, cross-document semantics"
run = "go test ./internal/contracts/..."

[tasks.test]
description = "All Go tests"
run = "go test ./..."

[tasks.lint]
description = "Vet, lint, format check and frontend typecheck"
run = [
  "go vet ./...",
  "golangci-lint run ./...",
  "test -z \"$(gofmt -l cmd internal web)\"",
  "pnpm --filter veduta-web check",
]

[tasks.build]
description = "Build the SPA and the binary"
run = "pnpm build"

[tasks.release-build]
description = "Cross-compile every release target (the SPA must be built first)"
run = """
set -e
for target in linux/amd64 linux/arm64 linux/arm darwin/arm64; do
  GOOS=${target%/*} GOARCH=${target#*/} GOARM=7 CGO_ENABLED=0 \
    go build -trimpath -ldflags "-s -w" -o "dist/veduta-${target%/*}-${target#*/}" ./cmd/veduta
done
ls -lh dist/
"""

[tasks.update]
description = "Update every dependency to its latest version (a reviewable commit, never automatic)"
run = "pnpm run update"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "test"]

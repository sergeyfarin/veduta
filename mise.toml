# Pinned toolchain. `mise install` sets everything up; `mise run check` runs what CI runs.
[tools]
go = "1.27"
node = "24"
pnpm = "11"

[env]
CGO_ENABLED = "0"

[tasks.install]
description = "Install dependencies"
run = ["go mod download", "pnpm --dir web install"]

[tasks.contracts]
description = "The contract suite: schemas, RE2 pattern portability, canonical digests, cross-document semantics"
run = "go test ./internal/contracts/..."

[tasks.test]
description = "All Go tests"
run = "go test ./..."

[tasks.lint]
description = "Vet and format check"
run = ["go vet ./...", "test -z \"$(gofmt -l cmd internal)\""]

[tasks.web]
description = "Frontend dev server (proxies /api to the Go server)"
run = "pnpm --dir web dev"

[tasks.build-web]
description = "Build the SPA into web/build for embedding"
run = "pnpm --dir web build"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "test"]

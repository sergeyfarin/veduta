# Root workspace. `pnpm dev`, `pnpm build`, `pnpm check` and `pnpm update` all run from here.
packages:
  - web

# esbuild ships a prebuilt platform binary and needs its postinstall to run; nothing else does.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
        - name: package-comments
    gosec:
      excludes:
        # G104 duplicates errcheck; G304 is about variable file paths, which the contract
        # tests legitimately use to read checked-in fixtures.
        - G104
    misspell:
      locale: UK

  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [veduta.dev/veduta]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
        - name: package-comments
    gosec:
      excludes:
        # G104 duplicates errcheck. G304 (variable file paths) is NOT excluded here: tests get it
        # via the _test.go exclusion below, and production code that legitimately reads an
        # operator-configured path carries a local nolint naming the reason - see
        # internal/connections/client.go's CAFile read and internal/api/background.go's.
        - G104
    misspell:
      locale: UK

  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [veduta.dev/veduta]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
